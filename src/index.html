<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fog Shader — Visual Computing 2026-II</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    #fog-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 220px;
      padding: 12px 14px;
      background: rgba(20, 26, 38, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      user-select: none;
    }
    #fog-panel .fog-panel-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    #fog-panel label {
      display: block;
      margin-top: 8px;
    }
    #fog-panel input[type="range"] {
      width: 100%;
      margin-top: 4px;
      cursor: pointer;
    }
    #fog-panel .fog-val {
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 480px) {
      #fog-panel {
        width: calc(100vw - 32px);
        max-width: 240px;
        font-size: 12px;
      }
    }
  </style>
  <script language="javascript" type="text/javascript" src="libraries/p5.min.js?v=1"></script>
  <!-- scripts se cargan en orden de dependencias -->
  <script language="javascript" type="text/javascript" src="config.js?v=2"></script>
  <script language="javascript" type="text/javascript" src="shaders.js?v=2"></script>
  <script language="javascript" type="text/javascript" src="ui.js?v=2"></script>
  <script language="javascript" type="text/javascript" src="main.js?v=2"></script>

</head>

<body>
</body>
</html>
